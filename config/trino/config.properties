# Single-node Trino, sized for its 4 GB container (compose.yaml). The image's default heap is
# 80% of the container, which left too little for off-heap memory: the kernel killed Trino
# under dbt's parallel queries (gotcha #39). Heap is fixed in jvm.config (2.5 GB), and query
# memory is bounded below it, so an oversized query fails or waits instead of the server dying.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
query.max-memory-per-node=1GB
query.max-memory=1GB
memory.heap-headroom-per-node=768MB
