# Trino catalog `lake`: Iceberg tables through the Lakekeeper REST catalog, data on MinIO.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=lakehouse
# Trino brings its own S3 credentials (the warehouse has STS and remote signing off).
iceberg.rest-catalog.vended-credentials-enabled=false
iceberg.file-format=PARQUET

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
