[project]
name = "olist-lakehouse"
version = "0.0.0"
description = "Local lakehouse: Olist CDC → Kafka → Spark → Iceberg → dbt → Airflow → Trino → Superset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.3,<4",
    "confluent-kafka>=2.15,<3",
    "faker>=40,<41",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
# The quality gate's second opinion (M2-S2): unit tests on the host, and the Spark image.
quality = [
    "great-expectations>=1.23,<2",
]
# Talks to the running stack (.\make.ps1 test-integration); CI does not install it.
integration = [
    "trino>=0.333",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_lakehouse"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", ".github/scripts", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "PTH",       # pathlib only: the repo path contains a space
    "RUF",
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.isort]
known-first-party = ["olist_lakehouse", "story_lint", "layout_lint"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", ".github/scripts", "tests"]
mypy_path = ".github/scripts"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Great Expectations (and pandas, which it brings) ship without complete type hints.
module = ["great_expectations", "great_expectations.*", "pandas", "pandas.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# PySpark comes from the Spark image (docker/spark/), not from uv.lock.
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# confluent-kafka ships no type hints (the C extension); treat it as Any, everywhere.
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Only installed with the integration group, which CI's type check does not sync.
module = ["trino", "trino.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".github/scripts"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs the compose stack up (.\\make.ps1 test-integration)",
]
