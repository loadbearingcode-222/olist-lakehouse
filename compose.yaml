# olist-lakehouse: the whole local platform. Grows story by story (docs/MILESTONES.md):
#   M0 lake core: MinIO (S3) · platform-db (Postgres) · Lakekeeper (Iceberg REST) · Trino
#   M1 source:    postgres-source (the Olist app DB) · replayer + clickstream (profile `replay`)
#   M1 CDC:       kafka (KRaft) · cdc-setup · connect (Debezium) · connect-register · console
#   M2 bronze:    bronze-stream (Spark Structured Streaming → Iceberg)
#   M4 batch:     platform-db-init · airflow-init · airflow-apiserver/scheduler/dag-processor/triggerer · data-docs
#
# Conventions
# - Image pins are exact and were checked live (ADR-0001, CLAUDE.md "Version pins").
# - Host ports are the 2xxxx family on 127.0.0.1 only (CLAUDE.md fleet ledger).
# - State lives in named volumes; only config is bind-mounted (the repo is on C:).
# - Every long-running service has a healthcheck and a mem_limit (budget: 20 GB in total).
# - Secrets come from .env (`.\make.ps1 env`); `:?` makes a missing one fail loudly.

name: olist-lakehouse

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?run .\make.ps1 env}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://platform:${PLATFORM_DB_PASSWORD:?run .\make.ps1 env}@platform-db:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://platform:${PLATFORM_DB_PASSWORD:?run .\make.ps1 env}@platform-db:5432/lakekeeper

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run .\make.ps1 env}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run .\make.ps1 env}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: olist-lakehouse/airflow:dev
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://platform:${PLATFORM_DB_PASSWORD:?run .\make.ps1 env}@platform-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run .\make.ps1 env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run .\make.ps1 env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # The project's code and tools, isolated from Airflow's own environment (docker/airflow).
    OLIST_PYTHON: /opt/olist-venv/bin/python
    OLIST_DBT: /opt/olist-venv/bin/dbt
    TRINO_HOST: trino
    TRINO_PORT: "8080"
    DBT_PROJECT_DIR: /opt/olist/dbt/olist
    DBT_PROFILES_DIR: /opt/olist/dbt/olist
    DBT_TARGET_PATH: /opt/airflow/dbt-target   # keep dbt's output out of the bind-mounted repo
    DBT_LOG_PATH: /opt/airflow/logs/dbt
    GX_ROOT: /opt/airflow/gx   # the bronze checkpoint's GX project and its Data Docs
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./dbt:/opt/olist/dbt
    - airflow-logs:/opt/airflow/logs
    - gx-data:/opt/airflow/gx
  user: "50000:0"
  depends_on: &airflow-depends-on
    platform-db-init:
      condition: service_completed_successfully
    trino:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ object storage
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: ["server", "/data", "--console-address", ":9001"]
    environment: *minio-credentials
    ports:
      - "127.0.0.1:29000:9000"   # S3 API
      - "127.0.0.1:29001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 1g
    restart: unless-stopped

  minio-init:
    # One-shot: creates the lakehouse bucket. Idempotent, so it runs on every `up`.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-credentials
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing local/lakehouse
    restart: "no"

  # ------------------------------------------------------------------ platform database
  platform-db:
    # Metadata for platform services (Lakekeeper now; Airflow and Superset later), one database
    # each. Not published to the host: nothing outside the network needs it.
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?run .\make.ps1 env}
      POSTGRES_DB: lakekeeper
    volumes:
      - platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m
    restart: unless-stopped

  # ------------------------------------------------------------------ Iceberg REST catalog
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["migrate"]
    environment: *lakekeeper-env
    depends_on:
      platform-db:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["serve"]
    environment: *lakekeeper-env
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:28181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck", "-a"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m
    restart: unless-stopped

  lakekeeper-bootstrap:
    # One-shot: accepts the terms once and creates the `lakehouse` warehouse on MinIO.
    # Idempotent: it reads the current state before writing anything.
    image: curlimages/curl:8.16.0
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: *minio-credentials
    entrypoint: ["/bin/sh", "/config/bootstrap.sh"]
    volumes:
      - ./config/lakekeeper:/config:ro
    restart: "no"

  # ------------------------------------------------------------------ SQL engine
  trino:
    image: trinodb/trino:483
    environment: *minio-credentials
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:28090:8080"
    volumes:
      - ./config/trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
    # The image's own healthcheck (/usr/lib/trino/bin/health-check) is inherited.
    mem_limit: 4g
    restart: unless-stopped

  # ------------------------------------------------------------------ the Olist "app"
  postgres-source:
    # The application database Debezium captures. wal_level=logical is what CDC needs.
    image: postgres:17.11-bookworm
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:?run .\make.ps1 env}
      POSTGRES_DB: olist
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - source-db:/var/lib/postgresql/data
      - ./docker/postgres-source:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 1g
    restart: unless-stopped

  replayer:
    # Writes the Olist timeline into postgres-source on a compressed business clock.
    # Not started by a plain `up`: `.\make.ps1 replay` starts it (profile `replay`).
    # on-failure, not unless-stopped: a finished replay exits 0 and must stay down.
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: olist-lakehouse/app:dev
    profiles: ["replay"]
    command: ["olist_lakehouse.replayer"]
    environment:
      PGHOST: postgres-source
      PGUSER: olist
      PGPASSWORD: ${SOURCE_DB_PASSWORD:?run .\make.ps1 env}
      PGDATABASE: olist
      OLIST_DATA_DIR: /data
      REPLAY_SPEED: ${REPLAY_SPEED:-1440}
      REPLAY_SEED: ${REPLAY_SEED:-42}
      # 2% of eligible events carry a defect by default: the quality gate (M2-S2) needs some.
      CHAOS_RATE: ${CHAOS_RATE:-0.02}
      REPLAY_UNTIL: ${REPLAY_UNTIL:-}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres-source:
        condition: service_healthy
    mem_limit: 2g
    restart: on-failure

  clickstream:
    # Web sessions for every replayed order, to Kafka topic clickstream.events (M1-S3).
    # Same image as the replayer; `.\make.ps1 replay` builds it once and starts both.
    image: olist-lakehouse/app:dev
    profiles: ["replay"]
    command: ["olist_lakehouse.clickstream"]
    environment:
      PGHOST: postgres-source
      PGUSER: olist
      PGPASSWORD: ${SOURCE_DB_PASSWORD:?run .\make.ps1 env}
      PGDATABASE: olist
      KAFKA_BOOTSTRAP: kafka:9092
      REPLAY_SEED: ${REPLAY_SEED:-42}
      CHAOS_RATE: ${CHAOS_RATE:-0.02}
    depends_on:
      postgres-source:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: on-failure

  # ------------------------------------------------------------------ CDC: Kafka + Debezium
  kafka:
    # One KRaft node (broker + controller, no ZooKeeper). Two listeners: `kafka:9092` inside
    # the network, `127.0.0.1:29092` for host clients (tests, the host-side tools).
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: olist-lakehouse-kraft-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
    mem_limit: 1536m
    restart: unless-stopped

  cdc-setup:
    # One-shot: the debezium role and the olist_cdc publication (config/connectors/setup.sql).
    image: postgres:17.11-bookworm
    depends_on:
      postgres-source:
        condition: service_healthy
    environment:
      PGHOST: postgres-source
      PGUSER: olist
      PGPASSWORD: ${SOURCE_DB_PASSWORD:?run .\make.ps1 env}
      PGDATABASE: olist
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?run .\make.ps1 env}
    entrypoint: ["sh", "-c", "psql -X -q -v debezium_password=\"$$DEBEZIUM_DB_PASSWORD\" -f /config/setup.sql"]
    volumes:
      - ./config/connectors:/config:ro
    restart: "no"

  connect:
    # Kafka Connect with the Debezium connectors. JSON without embedded schemas (ADR-0002).
    # The DB password reaches the connector through EnvVarConfigProvider, never the REST API.
    image: quay.io/debezium/connect:3.6.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      cdc-setup:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: olist-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 5000
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?run .\make.ps1 env}
      HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "127.0.0.1:28083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1536m
    restart: unless-stopped

  connect-register:
    # One-shot: PUT the connector config and wait until it is RUNNING (config/connectors/).
    image: curlimages/curl:8.16.0
    depends_on:
      connect:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/config/register.sh"]
    volumes:
      - ./config/connectors:/config:ro
    restart: "no"

  console:
    # Redpanda Console: topics, messages, consumer lag and the Connect cluster, in a browser.
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    depends_on:
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy   # it probes Connect once at startup
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:9092"]
        kafkaConnect:
          enabled: true
          clusters:
            - name: olist-connect
              url: http://connect:8083
    entrypoint: ["/bin/sh", "-c", "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml && exec /app/console"]
    ports:
      - "127.0.0.1:28080:8080"
    mem_limit: 256m
    restart: unless-stopped

  # ------------------------------------------------------------------ streaming ingest
  bronze-stream:
    # Kafka → Iceberg bronze, exactly once (src/olist_lakehouse/streaming/bronze.py). Spark in
    # local mode: driver and executors share this one container (ADR-0003).
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: olist-lakehouse/spark:dev
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[4]
      - --driver-memory
      - 2g
      - /opt/app/src/olist_lakehouse/streaming/bronze.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run .\make.ps1 env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run .\make.ps1 env}
      AWS_REGION: local-01
    ports:
      - "127.0.0.1:24040:4040"   # Spark UI (the Structured Streaming tab shows each query)
    depends_on:
      kafka:
        condition: service_healthy
      lakekeeper-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      # Its CDC topics exist once the connector runs. This also keeps `up --wait` green: a
      # one-shot that exits 0 counts as a failure unless someone waits for it (gotcha #29).
      connect-register:
        condition: service_completed_successfully
    mem_limit: 3g
    restart: unless-stopped

  # ------------------------------------------------------------------ batch orchestration
  platform-db-init:
    # One-shot: the databases platform services keep their metadata in (idempotent).
    image: postgres:17.11-bookworm
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      PGHOST: platform-db
      PGUSER: platform
      PGPASSWORD: ${PLATFORM_DB_PASSWORD:?run .\make.ps1 env}
      PGDATABASE: lakekeeper
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for db in airflow superset; do
          psql -Xqtc "SELECT 1 FROM pg_database WHERE datname = '$$db'" | grep -q 1 \
            || psql -Xqc "CREATE DATABASE $$db"
        done
        echo "platform-db-init: databases airflow, superset ready"
    restart: "no"

  airflow-init:
    <<: *airflow-common
    # Root, to chown the named log volume (Docker creates it root-owned; gotcha #14).
    user: "0:0"
    environment:
      <<: *airflow-env
      HOME: /home/airflow   # as root, ~ would hide the airflow user's install
      ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run .\make.ps1 env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mkdir -p /opt/airflow/logs/dbt /opt/airflow/gx
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/gx
        airflow db migrate
        # One writer at a time into lake.bronze.fx_rates (Iceberg commits conflict otherwise).
        airflow pools set fx_rates_writer 1 "Serialises MERGEs into lake.bronze.fx_rates"
        airflow users create --username admin --password "$$ADMIN_PASSWORD" \
          --firstname olist --lastname admin --role Admin --email admin@example.invalid || true
        echo "airflow-init: done"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:28082:8080"
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    mem_limit: 2g   # LocalExecutor: tasks (fx, dbt, GX) run inside this container
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --local"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s
    mem_limit: 384m
    restart: unless-stopped

  data-docs:
    # Great Expectations Data Docs for the bronze checkpoint (M4-S2), read-only. GX puts its
    # project in a gx/ folder under GX_ROOT, hence /gx/gx/.
    image: nginx:1.31.6-alpine
    volumes:
      - gx-data:/gx:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'server { listen 80; root /gx/gx/uncommitted/data_docs/local_site; index index.html; }\n' \
          > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:28089:80"
    mem_limit: 64m
    restart: unless-stopped

volumes:
  minio-data:
  platform-db:
  source-db:
  kafka-data:
  airflow-logs:
  gx-data:
