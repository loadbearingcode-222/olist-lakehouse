# Every pull request and every push to main.
#
# story-lint and layout-lint enforce the two things this repo is judged by first: the layout
# declared in docs/MILESTONES.md, and PRs that arrive as the plan's stories, in order.
#
# `edited` re-runs story-lint when a PR title changes. Every other job skips edits: a PR body
# update is not a code change.
#
# The full stack does not fit a private-repo runner (7 GB), so CI proves what it can in
# isolation; each story's end-to-end acceptance runs locally and its evidence is committed.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  story-lint:
    name: story-lint
    # Only open PRs: editing a merged PR fires `edited` too, and would report ALREADY-MERGED.
    if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The PR is the next story in docs/MILESTONES.md
        # Branch and title reach the script through env, never interpolated into the shell.
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/story_lint.py --branch "$HEAD_REF" --title "$PR_TITLE" --main-ref origin/main

  layout-lint:
    name: layout-lint
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every tracked path is declared in docs/MILESTONES.md
        run: python3 .github/scripts/layout_lint.py

  quality:
    name: lint / types / unit tests
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit

  compose-render:
    name: compose render
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml renders with every required variable set
        # Dummy values: this proves the file parses and every ${VAR:?} is declared in
        # .env.example, not that the stack runs (that is each story's local acceptance).
        run: |
          sed 's/=$/=ci-dummy/' .env.example > .env
          docker compose config --quiet
          echo "services: $(docker compose config --services | tr '\n' ' ')"
      - name: No image is left floating on a mutable tag
        run: |
          if docker compose config --images | grep -E ':(latest|main|latest-main)$|^[^:]+$'; then
            echo "::error title=compose-render::IMAGE-UNPINNED: pin every image to an exact tag (ADR-0001)"
            exit 1
          fi
