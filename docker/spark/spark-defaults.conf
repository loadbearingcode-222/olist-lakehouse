# Iceberg catalog `lake`: the same Lakekeeper warehouse Trino uses (config/trino/catalog/).
# No secrets here: S3FileIO and S3A both take AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the
# container environment (compose passes the MinIO credentials).
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                   rest
spark.sql.catalog.lake.uri                    http://lakekeeper:8181/catalog
spark.sql.catalog.lake.warehouse              lakehouse
spark.sql.catalog.lake.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint            http://minio:9000
spark.sql.catalog.lake.s3.path-style-access   true
spark.sql.catalog.lake.client.region          local-01

# S3A: only for Structured Streaming checkpoints (s3a://lakehouse/checkpoints/...).
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.endpoint.region           local-01
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false

# Business timestamps are naive Brazilian local time; keep Spark from shifting them.
spark.sql.session.timeZone                    UTC
spark.sql.shuffle.partitions                  8
spark.ui.port                                 4040
